log_format lab '$time_iso8601 source=$remote_addr sni=$ssl_server_name '
               'host=$http_host "$request" status=$status bytes=$body_bytes_sent '
               'tls=$ssl_protocol cipher=$ssl_cipher';

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/device/https.log lab;
    error_log /dev/stderr info;

    # Keep the internal experiment editor off the device-facing endpoint.
    location ^~ /__lab__/ { return 404; }
    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-SNI $ssl_server_name;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://mitm:8088;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
