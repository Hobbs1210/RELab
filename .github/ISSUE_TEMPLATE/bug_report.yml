name: Bug report
description: Report a reproducible issue in RELab
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private keys, proprietary firmware, real device identifiers, network captures, access tokens, or secrets."
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include sanitized commands, expected outcome, and actual outcome.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Debian 13 / Docker Compose v2 / RELab revision"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Only synthetic or redacted examples.
