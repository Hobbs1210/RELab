name: Validate research lab
on: [push, pull_request, workflow_dispatch]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate-project.py
      - run: python -m pytest -q tests/
      - run: bash -n scripts/setup.sh scripts/install-debian.sh
      - run: python scripts/package-release.py --output /tmp/device-re-lab-public.zip
      - run: unzip -t /tmp/device-re-lab-public.zip
      - run: cp .env.example .env && docker compose config -q
