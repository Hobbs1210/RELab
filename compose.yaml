name: device-re-lab

services:
  # AdGuard is the isolated test device's DNS server. First start is initialized by ./scripts/setup.sh.
  dns:
    image: adguard/adguardhome:v0.107.76
    restart: unless-stopped
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
      - "127.0.0.1:3000:3000/tcp"
    volumes:
      - ./config/adguard/work:/opt/adguardhome/work
      - ./config/adguard/conf:/opt/adguardhome/conf
    networks: [lab]

  # Native Streamable HTTP AdGuard MCP. Full tools enabled; keep host port loopback-only.
  mcp-dns:
    image: ghcr.io/samik081/mcp-adguard-home:latest
    restart: unless-stopped
    depends_on: [dns]
    environment:
      ADGUARD_URL: http://dns:3000
      ADGUARD_USERNAME: ${ADGUARD_USERNAME:-admin}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-SETUP_REQUIRED}
      ADGUARD_ACCESS_TIER: ${ADGUARD_ACCESS_TIER:-full}
      MCP_TRANSPORT: http
      MCP_PORT: "3000"
      MCP_HOST: 0.0.0.0
    ports: ["127.0.0.1:8301:3000/tcp"]
    networks: [lab]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      RULES_PATH: /config/rules.json
      DB_PATH: /data/requests.db
      SCENARIOS_PATH: /config/scenarios.json
      OWNED_DNS_PATH: /config/owned-dns.json
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-}
      ANALYSIS_PATH: /analysis
      FIRMWARE_PATH: /firmware
      PROFILE_DIR: /profiles
      TARGET_PROFILE: ${TARGET_PROFILE:-generic}
      ADGUARD_URL: http://dns:3000
      ADGUARD_USERNAME: ${ADGUARD_USERNAME:-admin}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-SETUP_REQUIRED}
    ports: ["127.0.0.1:8090:8000/tcp"]
    volumes:
      - ./config:/config
      - ./firmware:/firmware:ro
      - ./profiles:/profiles:ro
      - ./data/analysis:/analysis:ro
      - ./data/api:/data
    depends_on: [dns]
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__lab__/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8

  cert-init:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
        openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout /certs/server.key -out /certs/server.crt
        -subj '/CN=device-lab.local'
        -addext 'subjectAltName=DNS:device-lab.local';
      fi;
      chmod 600 /certs/server.key;
      echo 'Lab test certificate ready, NOT a Google-trusted certificate.'
    volumes: ["./certs:/certs"]
    restart: "no"
    networks: [lab]

  https-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cert-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
      mitm: {condition: service_started}
    ports: ["${HTTPS_BIND_IP:-127.0.0.1}:443:443/tcp"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./data/nginx:/var/log/device
    networks: [lab]

  # mitmproxy MCP runs inside mitmweb, not as a separate process.
  mitm:
    build: ./mcp/mitm
    restart: unless-stopped
    environment:
      MITMPROXY_MCP_MCP_HOST: 0.0.0.0
      MITMPROXY_MCP_MCP_PORT: "8000"
      MITMPROXY_MCP_MCP_TRANSPORT: streamable-http
      MITMPROXY_MCP_REDACTION_ENABLED: "true"
    command: ["mitmweb", "-s", "/opt/mitmproxy-mcp/addon.py", "--mode", "regular@8080", "--mode", "reverse:http://api:8000@8088", "--web-host", "0.0.0.0", "--listen-host", "0.0.0.0", "--no-web-open-browser", "--set", "mcp_transport=streamable-http", "--set", "mcp_port=8000", "--set", "keep_host_header=true", "--set", "save_stream_file=/data/flows.mitm"]
    ports:
      - "127.0.0.1:8080:8080/tcp"
      - "127.0.0.1:8081:8081/tcp"
      - "127.0.0.1:8302:8000/tcp"
    volumes:
      - ./data/mitm:/data
      - mitm-ca:/home/mitmproxy/.mitmproxy
    networks: [lab]

  # Read saved PCAPs using tshark. MCP streamable HTTP bridge to community stdio server.
  mcp-wireshark:
    build: ./mcp/wireshark
    restart: unless-stopped
    command: ["mcp-proxy", "--host", "0.0.0.0", "--port", "8000", "--", "mcp-wireshark"]
    ports: ["127.0.0.1:8303:8000/tcp"]
    volumes: ["./data/pcaps:/captures:ro"]
    tmpfs: [/tmp]
    networks: [lab]

  # BLE MCP listens even when BlueZ isn't accessible; scanning requires Linux + host DBus/BT.
  mcp-ble:
    build: ./mcp/ble
    restart: unless-stopped
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      BLE_MCP_ALLOW_WRITES: ${BLE_MCP_ALLOW_WRITES:-false}
      BLE_MCP_PLUGINS: ${BLE_MCP_PLUGINS:-}
      BLE_MCP_AUTH_TOKEN: ${BLE_MCP_AUTH_TOKEN:-}
      BLE_MCP_WRITE_ALLOWLIST: ${BLE_MCP_WRITE_ALLOWLIST:-}
    command: ["/bin/sh", "-ec", "exec ble_mcp --transport streamable-http --host 0.0.0.0 --port 8000 --no-auth"]
    ports: ["127.0.0.1:8304:8000/tcp"]
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - ./data/ble:/data
    networks: [lab]

  # Read-only Docker MCP through a Docker API proxy (not a direct socket mount).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      VERSION: "1"
      POST: "0"
      BUILD: "0"
      EXEC: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [docker-api]

  mcp-docker:
    build: ./mcp/docker
    restart: unless-stopped
    depends_on: [docker-socket-proxy]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOCKER_MCP_SERVER_READONLY: "true"
    command: ["mcp-proxy", "--host", "0.0.0.0", "--port", "8000", "--", "docker-mcp-server"]
    ports: ["127.0.0.1:8305:8000/tcp"]
    networks: [docker-api]

  analyzer:
    build: ./analysis
    restart: unless-stopped
    volumes:
      - ./data/pcaps:/captures:ro
      - ./data/analysis:/analysis
    environment:
      MAX_PCAP_BYTES: ${MAX_PCAP_BYTES:-209715200}
    networks: [lab]

  # Universal protocol workbench + read-only Streamable HTTP MCP, localhost only.
  workbench:
    build: ./workbench
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-}
      DB_PATH: /data/requests.db
      ANALYSIS_PATH: /analysis
      FIRMWARE_PATH: /firmware
      PROTOCOLS_PATH: /protocols
      OUTPUT_PATH: /outputs
      RESEARCH_HUB_URL: http://research-hub:8000
    ports: ["127.0.0.1:8310:8000/tcp"]
    volumes:
      - ./data/api:/data:ro
      - ./data/analysis:/analysis:ro
      - ./firmware:/firmware
      - ./protocols:/protocols
      - ./data/workbench:/outputs
      - /sys/class/tty:/sys/class/tty:ro
      - /sys/bus/usb/devices:/sys/bus/usb/devices:ro
    networks: [lab]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Unified research database and durable event bus (localhost-only, no exposed ports).
  research-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_DB: research
      POSTGRES_PASSWORD: ${RESEARCH_DB_PASSWORD:?Run scripts/setup.sh to generate RESEARCH_DB_PASSWORD}
    volumes: [research-postgres:/var/lib/postgresql/data]
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 15

  research-events:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--name", "device-re-lab"]
    volumes: [research-nats:/data]
    networks: [lab]

  research-hub:
    build: ./research-hub
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    depends_on:
      research-db: {condition: service_healthy}
      research-events: {condition: service_started}
    environment: &research-environment
      RESEARCH_DATABASE_URL: postgresql+psycopg://research:${RESEARCH_DB_PASSWORD:?Missing database password}@research-db:5432/research
      NATS_URL: nats://research-events:4222
      RESEARCH_ARTIFACTS: /research
      RESEARCH_INPUTS: /inputs
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:?Run scripts/setup.sh to generate LAB_ADMIN_TOKEN}
    volumes: &research-volumes
      - ./data/research:/research
      - ./firmware:/inputs/firmware:ro
      - ./data/pcaps:/inputs/pcaps:ro
      - ./data/mobile:/inputs/mobile:ro
      - ./data/serial:/inputs/serial:ro
      - ./data/ble:/inputs/ble:ro
      - ./protocols:/inputs/protocols:ro
      - ./data/research-imports:/inputs/other:ro
      - ./data/api:/inputs/api:ro
      - ./data/analysis:/inputs/analysis:ro
    ports: ["127.0.0.1:8320:8000/tcp"]
    networks: [lab]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8

  research-worker:
    build: ./research-hub
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    command: ["python", "worker.py"]
    depends_on:
      research-db: {condition: service_healthy}
      research-events: {condition: service_started}
    environment: *research-environment
    volumes: *research-volumes
    networks: [lab]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Optional 1GB+ firmware decompiler, available through port 8306 once built.
  ghidra:
    build:
      context: ./ghidra
      args:
        GHIDRA_RELEASE_URL: ${GHIDRA_RELEASE_URL:-}
    profiles: [ghidra]
    restart: unless-stopped
    ports: ["127.0.0.1:8306:8000/tcp"]
    volumes:
      - ./firmware:/firmware:ro
      - ./data/ghidra:/reports
      - ghidra-projects:/projects
    networks: [lab]

  capture:
    image: nicolaka/netshoot:latest
    profiles: [capture]
    network_mode: host
    cap_add: [NET_RAW]
    user: "0:0"
    restart: unless-stopped
    environment:
      TARGET_IP: ${TARGET_IP:-192.0.2.10}
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-any}
    command:
      - sh
      - -ec
      - |
        test "$$TARGET_IP" != "192.0.2.10" || { echo 'Set TARGET_IP in .env (single authorized test device)'; exit 1; }
        exec tcpdump -nn -i "$$CAPTURE_INTERFACE" -s 0 -G 300 -w '/captures/device-%Y%m%d-%H%M%S.pcap' "host $$TARGET_IP"
    volumes: ["./data/pcaps:/captures"]
    # Capture requires host gateway/TAP/SPAN visibility; not provided by Docker bridge.

  toolbox:
    image: nicolaka/netshoot:latest
    profiles: [tools]
    entrypoint: [/bin/sh]
    volumes: ["./data/pcaps:/captures:ro"]
    stdin_open: true
    tty: true
    networks: [lab]

  ble:
    build: ./ble
    profiles: [ble]
    network_mode: host
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - ./ble:/workspace
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Physical serial testing: NEVER started automatically; requires operator allowlist,
  # mapped port, explicit acknowledgement and --confirm in the invocation.
  fuzz-serial:
    build: ./fuzz
    profiles: [fuzz-hardware]
    restart: "no"
    environment:
      SERIAL_FUZZ_ACK: ${SERIAL_FUZZ_ACK:-DISABLED}
    devices:
      - "${SERIAL_FUZZ_DEVICE:-/dev/null}:/dev/fuzz-serial"
    entrypoint: ["python", "serial_fuzz.py"]
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Binwalk v3 from upstream source; build/pull only when firmware tools are needed.
  binwalk:
    build: ./firmware-tools/binwalk
    profiles: [firmware]
    working_dir: /firmware
    volumes:
      - ./firmware:/firmware:ro
      - ./data/firmware-extracted:/extracted
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # CPU/board-specific emulation; requires a compatible .resc script or modeled platform.
  renode:
    image: antmicro/renode:latest
    profiles: [emulation]
    working_dir: /work
    entrypoint: ["renode", "--disable-xwt"]
    volumes:
      - ./firmware:/firmware:ro
      - ./firmware-tools/renode:/work:ro
      - ./data/emulation:/reports
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # User-mode QEMU only. Does not emulate an unknown board automatically.
  qemu:
    build: ./firmware-tools/qemu
    profiles: [emulation]
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /firmware
    volumes: ["./firmware:/firmware:ro"]
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # SBOM only reads extracted or provided firmware trees.
  syft:
    image: anchore/syft:latest
    profiles: [sbom]
    volumes:
      - ./firmware:/firmware:ro
      - ./data/firmware-extracted:/extracted:ro
      - ./data/sbom:/reports
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Grype updates its vulnerability DB over the network; never exposes network services.
  grype:
    image: anchore/grype:latest
    profiles: [sbom]
    volumes:
      - ./data/sbom:/reports
      - grype-cache:/home/anchore/.cache
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Boofuzz can only reach our mock backend on the isolated fuzz network.
  fuzz:
    build: ./fuzz
    profiles: [fuzz]
    restart: "no"
    environment:
      FUZZ_TARGET: api
      FUZZ_PORT: "8000"
      FUZZ_MAX_CASES: ${FUZZ_MAX_CASES:-100}
    volumes: ["./data/fuzz:/results"]
    networks: [lab]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  lab: {}
  docker-api:
    internal: true
volumes:
  mitm-ca: {}
  ghidra-projects: {}
  grype-cache: {}
  research-postgres: {}
  research-nats: {}
